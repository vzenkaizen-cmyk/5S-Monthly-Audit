<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidullanka PLC – 5S Monthly Audit Sheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --ink:#1B2430;
    --ink-soft:#4B5563;
    --paper:#F2F4EF;
    --panel:#FFFFFF;
    --line:#DDE2D9;
    --green:#2F7A52;
    --green-deep:#1F5A3B;
    --amber:#C99A3E;
    --red:#B5533C;
    --r-poor:#B5533C;
    --r-fair:#C77B3E;
    --r-good:#C99A3E;
    --r-vgood:#7FA23E;
    --r-excellent:#2F7A52;
  }
  *{box-sizing:border-box;}
  #jasteca-root{
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:0;
    line-height:1.4;
  }
  #jasteca-root .serif{font-family:'Source Serif 4',serif;}
  #jasteca-root .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---------- Masthead ---------- */
  .mast{
    background:var(--ink);
    color:#fff;
    padding:22px 28px 20px;
    border-bottom:4px solid var(--green);
    position:relative;
    overflow:hidden;
  }
  .mast::after{
    content:'';
    position:absolute; right:-40px; top:-40px;
    width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle at center, rgba(47,122,82,0.35), transparent 70%);
  }
  .mast-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#9FCBB2; margin:0 0 4px;
  }
  .mast h1{
    font-family:'Source Serif 4',serif;
    font-size:26px; margin:0 0 2px; font-weight:700;
  }
  .mast p.sub{margin:0; color:#C8CDD6; font-size:13.5px;}
  .mast-brand{
    display:flex; align-items:center; gap:9px;
    position:absolute; right:28px; bottom:16px;
    z-index:1;
  }
  .mast-brand svg{flex-shrink:0;}
  .brand-chip{
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:#F4F5F1; border-radius:6px; padding:4px 7px;
    width:26px; height:26px;
  }
  .brand-chip img{width:100%; height:100%; object-fit:contain;}
  .mast-brand span{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:#9FCBB2; font-weight:600;
  }

  /* ---------- Meta bar ---------- */
  .metabar{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:16px 28px;
    display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end;
  }
  .field{display:flex; flex-direction:column; gap:4px; min-width:150px; flex:1;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600;}
  .field input, .field select, .field textarea{
    font-family:inherit; font-size:14px; padding:8px 10px;
    border:1px solid var(--line); border-radius:6px; background:#fdfdfb; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--green); outline-offset:1px; border-color:var(--green);}

  .btnrow{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:6px;
    padding:9px 14px; font-size:13.5px; font-weight:600; transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:hover{background:var(--green-deep);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:#EAEDE6;}
  .btn-danger{background:transparent; color:var(--red); border:1px solid #E4C9C0;}
  .btn-danger:hover{background:#FBEEEA;}
  .btn-sm{padding:5px 10px; font-size:12px;}

  select#loadSelect{max-width:220px;}

  /* ---------- Layout: gauge + sections ---------- */
  .layout{display:flex; gap:22px; padding:22px 28px 60px; align-items:flex-start; flex-wrap:wrap;}
  .gaugecol{
    width:230px; flex-shrink:0; position:sticky; top:16px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px;
  }
  .gauge-wrap{display:flex; flex-direction:column; align-items:center;}
  .gauge-score{font-family:'Source Serif 4',serif; font-size:34px; font-weight:700; margin-top:-58px;}
  .gauge-max{font-size:12px; color:var(--ink-soft); margin-top:-4px;}
  .gauge-band{font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-top:6px; padding:3px 10px; border-radius:20px;}
  .breakdown{margin-top:18px; display:flex; flex-direction:column; gap:7px;}
  .breakdown .brow{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft);}
  .breakdown .brow b{color:var(--ink); font-weight:600;}
  .breakdown .bartrack{height:5px; background:#EDEFE9; border-radius:3px; margin-top:2px; overflow:hidden;}
  .breakdown .barfill{height:100%; background:var(--green); border-radius:3px;}

  .maincol{flex:1; min-width:340px; display:flex; flex-direction:column; gap:14px;}

  /* ---------- Section cards ---------- */
  .section{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .section-head{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 18px; cursor:pointer; user-select:none;
    border-left:5px solid var(--green);
  }
  .section-head:hover{background:#F8F9F5;}
  .section-head .snum{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--green-deep);
    background:#E4EFE7; padding:2px 8px; border-radius:5px; margin-right:8px;
  }
  .section-head h3{font-family:'Source Serif 4',serif; font-size:16.5px; margin:0; display:inline;}
  .section-head .sdesc{font-size:12px; color:var(--ink-soft); margin:3px 0 0; font-weight:400;}
  .section-head .stotal{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; white-space:nowrap;}
  .section-head .chev{transition:transform .18s ease; color:var(--ink-soft); flex-shrink:0;}
  .section.open .chev{transform:rotate(180deg);}

  .section-body{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    border-top:1px solid transparent;
  }
  .section.open .section-body{border-top:1px solid var(--line);}
  .section-body-inner{padding:6px 18px 16px;}

  .item{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding:11px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap;
  }
  .item:last-child{border-bottom:none;}
  .item-label{flex:1; min-width:220px; font-size:13.5px;}
  .item-label .inum{color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11.5px; margin-right:6px;}

  .pills{display:flex; gap:5px; flex-shrink:0;}
  .pill{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:all .12s ease;
  }
  .pill:hover{border-color:var(--green);}
  .pill.selected{color:#fff; border-color:transparent;}
  .pill[data-v="1"].selected{background:var(--r-poor);}
  .pill[data-v="2"].selected{background:var(--r-fair);}
  .pill[data-v="3"].selected{background:var(--r-good);}
  .pill[data-v="4"].selected{background:var(--r-vgood);}
  .pill[data-v="5"].selected{background:var(--r-excellent);}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--ink-soft); padding:2px 18px 14px;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}

  .notes-toggle{font-size:12px; color:var(--green-deep); cursor:pointer; margin-top:8px; display:inline-block; font-weight:600;}
  .notes-area{display:none; margin-top:8px;}
  .notes-area.show{display:block;}
  .notes-area textarea{width:100%; min-height:60px; font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; resize:vertical;}

  /* Section 14 */
  .q14{padding:14px 18px;}
  .q14-item{padding:14px 0; border-bottom:1px dashed var(--line);}
  .q14-item:last-child{border-bottom:none;}
  .q14-item .qhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .q14-item .qnum{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--green-deep); font-weight:700;}
  .q14-item p.qtext{font-size:13.5px; margin:4px 0 8px;}
  .q14-item textarea{width:100%; min-height:80px; font-family:inherit; font-size:13.5px; padding:9px 10px; border:1px solid var(--line); border-radius:6px; resize:vertical;}
  .q14-foot{display:flex; justify-content:space-between; align-items:center; margin-top:6px; flex-wrap:wrap; gap:8px;}
  .wordcount{font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .wordcount.over{color:var(--red); font-weight:700;}
  .scoreinput{display:flex; align-items:center; gap:6px;}
  .scoreinput label{font-size:11px; color:var(--ink-soft); font-weight:600;}
  .scoreinput input{width:56px; padding:5px 6px; border:1px solid var(--line); border-radius:5px; font-family:'IBM Plex Mono',monospace; text-align:center;}

  .grandcard{
    background:var(--ink); color:#fff; border-radius:10px; padding:20px 22px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
  }
  .grandcard .gt-label{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#9FCBB2;}
  .grandcard .gt-score{font-family:'Source Serif 4',serif; font-size:30px; font-weight:700;}
  .savebox{padding:8px 18px; background:transparent;}
  .status-msg{font-size:12px; color:var(--green-deep); font-weight:600; min-height:16px; padding:0 18px;}

  .signature-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px;}
  .signature-card h3{font-family:'Source Serif 4',serif;margin:0 0 4px;font-size:17px;}
  .signature-card .sig-help{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .signature-summary{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#F7F8F5;border:1px solid var(--line);border-radius:7px;padding:10px 12px;margin-bottom:12px;}
  .signature-summary b{color:var(--ink);}
  .signature-pad-wrap{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
  #signatureCanvas{display:block;width:100%;height:180px;background:#fff;cursor:crosshair;touch-action:none;}
  .signature-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .signature-status{font-size:12px;color:var(--ink-soft);}
  .signature-status.signed{color:var(--green-deep);font-weight:600;}

  .savedlist{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 18px;}
  .savedlist h4{font-family:'Source Serif 4',serif; margin:0 0 8px; font-size:14.5px;}
  .savedrow{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; gap:10px; flex-wrap:wrap;}
  .savedrow:last-child{border-bottom:none;}
  .savedrow .meta{color:var(--ink-soft); font-size:11.5px;}

  @media (max-width: 720px){
    .layout{flex-direction:column;}
    .gaugecol{width:100%; position:static;}
  }
</style>
</head>

      meta:{org:'', dept:'', month:'', auditor:''},
      scores:{},          // itemKey -> 1..5
      sectionNotes:{},    // sectionId -> text
      q14:{ text:{}, score:{} }, // qid -> text / score(0-10)
      specialNote:'',
      signature:{dataUrl:'', signedAt:null},
      savedAt:null
    };
  }
  let audit = blankAudit();

  // ---------------- DOM refs ----------------
  const $ = sel => root.querySelector(sel);
  const elOrg = $('#f-org'), elDept = $('#f-dept'), elMonth = $('#f-month'), elAuditor = $('#f-auditor');
  const elLoadSelect = $('#loadSelect');
  const elStatus = $('#statusMsg');
  const sectionsWrap = $('#sectionsWrap');
  const bottomWrap = $('#bottomWrap');
  const gaugeScore = $('#gaugeScore');
  const gaugeBand = $('#gaugeBand');
  const gaugeSvg = $('#gaugeSvg');
  const breakdownEl = $('#breakdown');

  // ---------------- Rendering: sections ----------------
  function itemKey(sectionId, code){ return sectionId+'_'+code; }

  function sectionTotal(section){
    let t=0;
    section.items.forEach(([code])=>{
      const v = audit.scores[itemKey(section.id, code)];
      if(v) t+=v;
    });
    return t;
  }

  function renderSections(){
    sectionsWrap.innerHTML='';
    SECTIONS.forEach(section=>{
      const card = document.createElement('div');
      card.className='section';
      card.dataset.sec = section.id;

      const head = document.createElement('div');
      head.className='section-head';
      head.innerHTML = `
        <div>
          <span class="snum">${section.num}</span><h3 class="serif">${section.title}</h3>
          <p class="sdesc">${section.desc}</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="stotal">${sectionTotal(section)} / ${section.max}</span>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>`;
      head.addEventListener('click', ()=>{
        card.classList.toggle('open');
        const body = card.querySelector('.section-body');
        body.style.maxHeight = card.classList.contains('open') ? body.scrollHeight+400+'px' : '0px';
      });

      const body = document.createElement('div');
      body.className='section-body';
      const inner = document.createElement('div');
      inner.className='section-body-inner';

      section.items.forEach(([code,label])=>{
        const key = itemKey(section.id, code);
        const row = document.createElement('div');
        row.className='item';
        const pillsHtml = [1,2,3,4,5].map(v=>{
          const sel = audit.scores[key]===v ? 'selected':'';
          return `<div class="pill ${sel}" data-v="${v}" data-key="${key}" title="${RATING_LABELS[v-1]}">${v}</div>`;
        }).join('');
        row.innerHTML = `<div class="item-label"><span class="inum">${code}</span>${label}</div><div class="pills">${pillsHtml}</div>`;
        inner.appendChild(row);
      });

      // legend
      const legend = document.createElement('div');
      legend.className='legend';
      legend.innerHTML = RATING_LABELS.map((l,i)=>`<span><i style="background:${RATING_COLORS[i]}"></i>${i+1} · ${l}</span>`).join('');
      inner.appendChild(legend);

      // notes toggle
      const notesToggle = document.createElement('span');
      notesToggle.className='notes-toggle';
      notesToggle.textContent = '+ Add notes / evidence for this section';
      const notesArea = document.createElement('div');
      notesArea.className='notes-area';
      notesArea.innerHTML = `<textarea placeholder="Optional: observations, evidence references, corrective actions...">${audit.sectionNotes[section.id]||''}</textarea>`;
      notesToggle.addEventListener('click', ()=>{
        notesArea.classList.toggle('show');
        notesToggle.textContent = notesArea.classList.contains('show') ? '– Hide notes' : '+ Add notes / evidence for this section';
      });
      if(audit.sectionNotes[section.id]) notesArea.classList.add('show');
      notesArea.querySelector('textarea').addEventListener('input', e=>{
        audit.sectionNotes[section.id]=e.target.value;
      });
      inner.appendChild(notesToggle);
      inner.appendChild(notesArea);

      body.appendChild(inner);
      card.appendChild(head);
      card.appendChild(body);
      sectionsWrap.appendChild(card);
    });

    // pill click handling (event delegation)
    // Use one delegated click handler; fullRender() can rebuild the sections.
    sectionsWrap.onclick = e=>{
      const pill = e.target.closest('.pill');
      if(!pill) return;
      const key = pill.dataset.key;
      const v = parseInt(pill.dataset.v,10);
      audit.scores[key] = (audit.scores[key]===v) ? undefined : v; // click again to clear
      if(audit.scores[key]===undefined) delete audit.scores[key];
      refreshAll();
    };
  }

  function refreshSectionTotals(){
    SECTIONS.forEach(section=>{
      const card = sectionsWrap.querySelector(`.section[data-sec="${section.id}"]`);
      if(!card) return;
      card.querySelector('.stotal').textContent = `${sectionTotal(section)} / ${section.max}`;
      card.querySelectorAll('.pill').forEach(p=>{
        const key = p.dataset.key, v = parseInt(p.dataset.v,10);
        p.classList.toggle('selected', audit.scores[key]===v);

  // ---------------- Section 14 ----------------
  function q14Total(){
    return Q14.reduce((a,q)=> a + (audit.q14.score[q.id]||0), 0);
  }

  function renderQ14(){
    const card = document.createElement('div');
    card.className='section';
    card.id='q14card';
    const head = document.createElement('div');
    head.className='section-head';
    head.innerHTML = `
      <div>
        <span class="snum">14</span><h3 class="serif">Other Japanese Management Practices</h3>
        <p class="sdesc">Concise written responses (max 100 words each) supported by photographs / records / evidence.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="stotal" id="q14total">${q14Total()} / ${Q14_MAX}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>`;
    head.addEventListener('click', ()=>{
      card.classList.toggle('open');
      const body = card.querySelector('.section-body');
      body.style.maxHeight = card.classList.contains('open') ? body.scrollHeight+400+'px' : '0px';
    });

    const body = document.createElement('div');
    body.className='section-body';
    const inner = document.createElement('div');
    inner.className='q14';

    Q14.forEach(q=>{
      const wrap = document.createElement('div');
      wrap.className='q14-item';
      const savedText = audit.q14.text[q.id]||'';
      const savedScore = audit.q14.score[q.id]!==undefined ? audit.q14.score[q.id] : '';
      wrap.innerHTML = `
        <div class="qhead"><span class="qnum">${q.label}</span></div>
        <p class="qtext">${q.text}</p>
        <textarea placeholder="Write response here (max ~100 words), reference evidence attached separately...">${savedText}</textarea>
        <div class="q14-foot">
          <span class="wordcount">0 words</span>
          <div class="scoreinput">
            <label>Score</label>
            <input type="number" min="0" max="10" step="1" value="${savedScore}" placeholder="0–10" />
            <span style="font-size:11px;color:var(--ink-soft);">/ 10</span>
          </div>
        </div>`;
      const ta = wrap.querySelector('textarea');
      const wc = wrap.querySelector('.wordcount');
      const scoreInput = wrap.querySelector('.scoreinput input');

      function updWc(){
        const words = ta.value.trim().length ? ta.value.trim().split(/\s+/).length : 0;
        wc.textContent = words + ' words';
        wc.classList.toggle('over', words>100);
      }
      updWc();
      ta.addEventListener('input', ()=>{
        audit.q14.text[q.id]=ta.value;
        updWc();
      });
      scoreInput.addEventListener('input', ()=>{
        let v = scoreInput.value==='' ? undefined : Math.max(0,Math.min(10, parseInt(scoreInput.value,10)||0));
        if(v===undefined){ delete audit.q14.score[q.id]; } else { audit.q14.score[q.id]=v; }
        refreshAll();
      });
      inner.appendChild(wrap);
    });

    body.appendChild(inner);
    card.appendChild(head);
    card.appendChild(body);
    return card;
  }

  function refreshQ14Total(){
    const t = document.getElementById('q14total');
    if(t) t.textContent = `${q14Total()} / ${Q14_MAX}`;
  }

  // ---------------- Bottom: special note + grand total ----------------

    bottomWrap.innerHTML='';

    bottomWrap.appendChild(q14card);

    const noteCard = document.createElement('div');

    grand.innerHTML = `
      <div>

        <div class="gt-score" id="grandScoreLine">0 / ${GRAND_MAX + Q14_MAX}</div>

    bottomWrap.appendChild(grand);

    const currentTotal = SECTIONS.reduce((a,s)=>a+sectionTotal(s),0) + q14Total();

      <div class="signature-summary">
        <span><b>Final Score:</b> <span id="sigTotal">${currentTotal} / ${GRAND_MAX + Q14_MAX}</span></span>
        <span><b>Auditor:</b> <span id="sigAuditor">${escHtml(audit.meta.auditor || 'Not entered')}</span></span>
      </div>
      <div class="signature-pad-wrap">

      </div>

        <button class="btn-ghost btn-sm" id="btnClearSignature" type="button">Clear Signature</button>
        <span class="signature-status ${audit.signature && audit.signature.dataUrl ? 'signed' : ''}" id="signatureStatus">
          ${audit.signature && audit.signature.dataUrl
            ? '✓ Signature captured' + (audit.signature.signedAt ? ' · ' + new Date(audit.signature.signedAt).toLocaleString() : '')
            : 'Please sign above after confirming the final score.'}

  // ---------------- Auditor E-Signature ----------------
  function escHtml(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function initSignaturePad(){
    const canvas = document.getElementById('signatureCanvas');
    const clearBtn = document.getElementById('btnClearSignature');
    if(!canvas || !clearBtn) return;

    const ctx = canvas.getContext('2d');
    let drawing = false;

    function setupCanvas(){
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.round(rect.width*dpr));
      canvas.height = Math.max(1, Math.round(rect.height*dpr));
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#1B2430';

      if(audit.signature && audit.signature.dataUrl){
        const img = new Image();
        img.onload = () => ctx.drawImage(img,0,0,rect.width,rect.height);
        img.src = audit.signature.dataUrl;
      }
    }

    function point(e){
      const r = canvas.getBoundingClientRect();
      return {x:e.clientX-r.left,y:e.clientY-r.top};
    }

    function start(e){
      drawing = true;
      canvas.setPointerCapture?.(e.pointerId);
      const p = point(e);
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      e.preventDefault();
    }

    function move(e){
      if(!drawing) return;
      const p = point(e);
      ctx.lineTo(p.x,p.y);
      ctx.stroke();
      e.preventDefault();
    }

    function end(e){
      if(!drawing) return;
      drawing = false;
      ctx.closePath();
      audit.signature.dataUrl = canvas.toDataURL('image/png');
      audit.signature.signedAt = new Date().toISOString();

      const status = document.getElementById('signatureStatus');
      if(status){
        status.textContent = '✓ Signature captured · ' + new Date(audit.signature.signedAt).toLocaleString();
        status.classList.add('signed');
      }
      e.preventDefault();
    }

    canvas.addEventListener('pointerdown',start);
    canvas.addEventListener('pointermove',move);
    canvas.addEventListener('pointerup',end);
    canvas.addEventListener('pointercancel',end);
    canvas.addEventListener('pointerleave',end);

    clearBtn.addEventListener('click',()=>{
      ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
      audit.signature={dataUrl:'',signedAt:null};
      const status=document.getElementById('signatureStatus');
      if(status){
        status.textContent='Please sign above after confirming the final score.';
        status.classList.remove('signed');
      }
    });

    setupCanvas();
  }

  // ---------------- Gauge ----------------
  function drawGauge(){
    const total = SECTIONS.reduce((a,s)=>a+sectionTotal(s),0);
    const pct = Math.max(0, Math.min(1, total/GRAND_MAX));
    const cx=100, cy=100, r=80;
    const startAngle = Math.PI, endAngle = Math.PI + Math.PI*pct;
    function pt(a){ return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
    const [x1,y1] = pt(Math.PI);
    const [x2,y2] = pt(Math.PI*2);
    const [x3,y3] = pt(startAngle+ (Math.PI*pct));
    const largeArc = pct>0.5 ? 1 : 0;

    let color = '#B5533C';
    let band = 'Needs attention';
    if(pct>=0.85){color='#2F7A52'; band='Excellent';}
    else if(pct>=0.7){color='#7FA23E'; band='Very good';}
    else if(pct>=0.55){color='#C99A3E'; band='Good';}
    else if(pct>=0.35){color='#C77B3E'; band='Fair';}

    gaugeSvg.innerHTML = `
      <path d="M ${x1} ${y1} A ${r} ${r} 0 1 1 ${x2} ${y2}" fill="none" stroke="#EAEDE6" stroke-width="14" stroke-linecap="round"/>
      ${pct>0 ? `<path d="M ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x3} ${y3}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>` : ''}
    `;
    gaugeScore.textContent = total;
    gaugeScore.style.color = color;
    gaugeBand.textContent = band;
    gaugeBand.style.background = color+'22';
    gaugeBand.style.color = color;
  }

  function renderBreakdown(){
    breakdownEl.innerHTML = SECTIONS.map(s=>{
      const t = sectionTotal(s);
      const pct = Math.round((t/s.max)*100);
      return `<div class="brow"><span>${s.num}. ${s.title}</span><b>${t}/${s.max}</b></div>
        <div class="bartrack"><div class="barfill" style="width:${pct}%;"></div></div>`;
    }).join('');
  }

  function refreshAll(){
    refreshSectionTotals();
    refreshQ14Total();
    drawGauge();
    renderBreakdown();
    const line = document.getElementById('grandScoreLine');
    if(line){
      const total = SECTIONS.reduce((a,s)=>a+sectionTotal(s),0) + q14Total();
      line.textContent = `${total} / ${GRAND_MAX + Q14_MAX}`;
      const sigTotal=document.getElementById('sigTotal');
      if(sigTotal) sigTotal.textContent=`${total} / ${GRAND_MAX + Q14_MAX}`;
      const sigAuditor=document.getElementById('sigAuditor');
      if(sigAuditor) sigAuditor.textContent=audit.meta.auditor || 'Not entered';
    }
  }

  // ---------------- Meta binding ----------------
  function bindMeta(){
    elOrg.value = audit.meta.org||'';
    elDept.value = audit.meta.dept||'';
    elMonth.value = audit.meta.month||'';
    elAuditor.value = audit.meta.auditor||'';
  }
  elOrg.addEventListener('input', e=> audit.meta.org=e.target.value);
  elDept.addEventListener('input', e=> audit.meta.dept=e.target.value);
  elMonth.addEventListener('input', e=> audit.meta.month=e.target.value);
  elAuditor.addEventListener('input', e=> audit.meta.auditor=e.target.value);

  function fullRender(){
    bindMeta();
    renderSections();
    renderBottom();
    refreshAll();
  }

  // ---------------- Storage ----------------
  // The original version used window.storage, which is not a standard
  // browser API. Live Server and GitHub Pages do not provide it.
  // Use localStorage in normal browsers, while keeping compatibility
  // if a host provides window.storage.
  if (!window.storage) {
    window.storage = {
      async get(key){
        const value = window.localStorage.getItem(key);
        return value === null ? null : { value };
      },
      async set(key, value){
        window.localStorage.setItem(key, value);
        return { value };
      },
      async delete(key){
        window.localStorage.removeItem(key);
      }
    };
  }

  const INDEX_KEY = 'audit-index';

  async function getIndex(){
    try{
      const r = await window.storage.get(INDEX_KEY, false);
      return r ? JSON.parse(r.value) : [];
    }catch(e){ console.error('index load failed', e); return []; }
  }

  async function setIndex(list){
    try{ await window.storage.set(INDEX_KEY, JSON.stringify(list), false); }
    catch(e){ console.error('index save failed', e); }
  }

  function showStatus(msg, isErr){
    elStatus.textContent = msg;
    elStatus.style.color = isErr ? 'var(--red)' : 'var(--green-deep)';
    setTimeout(()=>{ if(elStatus.textContent===msg) elStatus.textContent=''; }, 3500);
  }

  async function refreshLoadSelect(){
    const list = await getIndex();
    list.sort((a,b)=> b.month.localeCompare(a.month));
    elLoadSelect.innerHTML = '<option value="">— select month —</option>' +
      list.map(x=>`<option value="${x.month}">${x.month}${x.org? ' · '+x.org:''} (${x.total}/${GRAND_MAX+Q14_MAX})</option>`).join('');
  }

  async function saveAudit(){
    if(!audit.meta.month){
      showStatus('Please choose an audit month before saving.', true);
      return;
    }
    if(!audit.signature || !audit.signature.dataUrl){
      showStatus('Please provide the auditor e-signature before saving the final audit.', true);
      document.getElementById('signatureCanvas')?.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    audit.savedAt = new Date().toISOString();
    const key = 'audit:'+audit.meta.month;
    try{
      await window.storage.set(key, JSON.stringify(audit), false);
      const total = SECTIONS.reduce((a,s)=>a+sectionTotal(s),0) + q14Total();
      const list = await getIndex();
      const idx = list.findIndex(x=>x.month===audit.meta.month);
      const entry = {month:audit.meta.month, org:audit.meta.org, total, savedAt:audit.savedAt};
      if(idx>=0) list[idx]=entry; else list.push(entry);
      await setIndex(list);
      await refreshLoadSelect();
      elLoadSelect.value = audit.meta.month;
      showStatus('Saved audit for '+audit.meta.month+'.');
    }catch(e){
      console.error(e);
      showStatus('Could not save — please try again.', true);
    }
  }

  async function loadAudit(month){
    if(!month) return;
    try{
      const r = await window.storage.get('audit:'+month, false);
      if(!r){ showStatus('No saved audit found for that month.', true); return; }
      audit = JSON.parse(r.value);
      if(!audit.signature) audit.signature={dataUrl:'',signedAt:null};
      fullRender();
      showStatus('Loaded audit for '+month+'.');
    }catch(e){
      console.error(e);
      showStatus('Could not load that audit.', true);
    }
  }

  async function deleteAudit(){
    const month = audit.meta.month;
    if(!month){ showStatus('Nothing to delete.', true); return; }
    if(!confirm('Delete the saved audit for '+month+'? This cannot be undone.')) return;
    try{
      await window.storage.delete('audit:'+month, false);
      const list = await getIndex();
      await setIndex(list.filter(x=>x.month!==month));
      await refreshLoadSelect();
      audit = blankAudit();
      fullRender();
      showStatus('Deleted audit for '+month+'.');
    }catch(e){
      console.error(e);
      showStatus('Could not delete — please try again.', true);
    }
  }

  // ---------------- Export to Excel ----------------
  function exportToExcel(){
    if(typeof XLSX === 'undefined'){
      showStatus('Excel library failed to load — check your connection and retry.', true);
      return;
    }
    const rows = [];
    rows.push(['JASTECA National Awards — "Taiki Akimoto" Japanese Management Excellence Awards']);
    rows.push(['5S Monthly Audit Sheet — Service & Manufacturing Sectors']);
    rows.push([]);
    rows.push(['Organisation', audit.meta.org||'']);
    rows.push(['Department / Site', audit.meta.dept||'']);
    rows.push(['Audit month', audit.meta.month||'']);
    rows.push(['Auditor', audit.meta.auditor||'']);
    rows.push(['Saved at', audit.savedAt||'']);
    rows.push([]);
    rows.push(['S.No','Description','Rating (1-5)','Rating label']);

    SECTIONS.forEach(section=>{
      rows.push([`${section.num}. ${section.title.toUpperCase()}`, section.desc, '', '']);
      section.items.forEach(([code,label])=>{
        const key = itemKey(section.id, code);
        const v = audit.scores[key];
        rows.push([code, label, v||'', v?RATING_LABELS[v-1]:'']);
      });
      rows.push(['', `TOTAL (out of ${section.max})`, sectionTotal(section), '']);
      if(audit.sectionNotes[section.id]){
        rows.push(['', 'Notes: '+audit.sectionNotes[section.id], '', '']);
      }
      rows.push([]);
    });

    const grand5s = SECTIONS.reduce((a,s)=>a+sectionTotal(s),0);
    rows.push(['', `GRAND TOTAL — Sections 1-13 (out of ${GRAND_MAX})`, grand5s, '']);
    rows.push([]);

    rows.push(['14. OTHER JAPANESE MANAGEMENT PRACTICES','','Score (0-10)','']);
    Q14.forEach(q=>{
      rows.push([q.label, q.text, audit.q14.score[q.id]!==undefined?audit.q14.score[q.id]:'', '']);
      rows.push(['', 'Response: '+(audit.q14.text[q.id]||''), '', '']);
    });
    rows.push(['', `TOTAL (out of ${Q14_MAX})`, q14Total(), '']);
    rows.push([]);

    rows.push(['', `OVERALL GRAND TOTAL (out of ${GRAND_MAX+Q14_MAX})`, grand5s+q14Total(), '']);
    rows.push([]);
    rows.push(['Auditor E-Signature', audit.signature && audit.signature.dataUrl ? 'Captured' : 'Not signed']);
    rows.push(['Signature timestamp', audit.signature && audit.signature.signedAt ? audit.signature.signedAt : '']);
    rows.push([]);
    rows.push(['Special note by the auditors', audit.specialNote||'']);

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:10},{wch:70},{wch:14},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Audit Sheet');

    const monthLabel = audit.meta.month || 'draft';
    const fname = `5S-Audit-${monthLabel}${audit.meta.org? '-'+audit.meta.org.replace(/[^a-z0-9]+/gi,'_') : ''}.xlsx`;
    XLSX.writeFile(wb, fname);
    showStatus('Downloaded '+fname);
  }

  // ---------------- Export to Word ----------------
  function esc(s){
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function exportToWord(){
    const grand5s = SECTIONS.reduce((a,s)=>a+sectionTotal(s),0);
    const overall = grand5s + q14Total();

    let body = '';
    body += `<h1 style="font-family:Calibri,sans-serif;font-size:18pt;text-align:center;margin-bottom:2px;">JASTECA National Awards</h1>`;
    body += `<h2 style="font-family:Calibri,sans-serif;font-size:13pt;text-align:center;font-style:italic;margin-top:0;">"Taiki Akimoto" Japanese Management Excellence Awards</h2>`;
    body += `<h3 style="font-family:Calibri,sans-serif;font-size:14pt;text-align:center;text-decoration:underline;">Audit Sheet</h3>`;
    body += `<p style="font-family:Calibri,sans-serif;font-size:11pt;text-align:center;">Service &amp; Manufacturing Sectors (5S, KPIs, and Japanese Management Implementations)</p>`;

    body += `<table style="border-collapse:collapse;width:100%;font-family:Calibri,sans-serif;font-size:10.5pt;margin-top:10px;" cellpadding="4">`;
    const metaRow = (k,v)=>`<tr><td style="border:1px solid #999;width:22%;background:#F2F4EF;"><b>${esc(k)}</b></td><td style="border:1px solid #999;">${esc(v)}</td></tr>`;
    body += metaRow('Organisation', audit.meta.org);
    body += metaRow('Department / Site', audit.meta.dept);
    body += metaRow('Audit month', audit.meta.month);
    body += metaRow('Auditor', audit.meta.auditor);
    body += `</table>`;

    SECTIONS.forEach(section=>{
      body += `<h4 style="font-family:Calibri,sans-serif;font-size:12pt;margin:16px 0 2px;">${esc(section.num+'. '+section.title.toUpperCase())}</h4>`;
      body += `<p style="font-family:Calibri,sans-serif;font-size:9.5pt;color:#555;margin:0 0 6px;">${esc(section.desc)}</p>`;
      body += `<table style="border-collapse:collapse;width:100%;font-family:Calibri,sans-serif;font-size:10pt;" cellpadding="4">`;
      body += `<tr style="background:#1B2430;color:#fff;"><td style="border:1px solid #999;width:8%;"><b>S.No</b></td><td style="border:1px solid #999;width:62%;"><b>Description</b></td><td style="border:1px solid #999;width:12%;"><b>Rating</b></td><td style="border:1px solid #999;width:18%;"><b>Label</b></td></tr>`;
      section.items.forEach(([code,label])=>{
        const key = itemKey(section.id, code);
        const v = audit.scores[key];
        body += `<tr><td style="border:1px solid #999;">${esc(code)}</td><td style="border:1px solid #999;">${esc(label)}</td><td style="border:1px solid #999;text-align:center;">${v||''}</td><td style="border:1px solid #999;">${v?RATING_LABELS[v-1]:''}</td></tr>`;
      });
      body += `<tr><td style="border:1px solid #999;"></td><td style="border:1px solid #999;"><b>TOTAL (out of ${section.max})</b></td><td style="border:1px solid #999;text-align:center;"><b>${sectionTotal(section)}</b></td><td style="border:1px solid #999;"></td></tr>`;
      body += `</table>`;
      if(audit.sectionNotes[section.id]){
        body += `<p style="font-family:Calibri,sans-serif;font-size:9.5pt;margin:6px 0 0;"><b>Notes:</b> ${esc(audit.sectionNotes[section.id])}</p>`;
      }
    });

    body += `<h3 style="font-family:Calibri,sans-serif;font-size:13pt;margin-top:18px;">GRAND TOTAL — Sections 1–13: ${grand5s} / ${GRAND_MAX}</h3>`;

    body += `<h4 style="font-family:Calibri,sans-serif;font-size:12pt;margin-top:18px;">14. OTHER JAPANESE MANAGEMENT PRACTICES</h4>`;
    Q14.forEach(q=>{
      const score = audit.q14.score[q.id]!==undefined ? audit.q14.score[q.id] : '';
      body += `<p style="font-family:Calibri,sans-serif;font-size:10.5pt;margin:10px 0 2px;"><b>${esc(q.label)}</b> ${esc(q.text)}</p>`;
      body += `<p style="font-family:Calibri,sans-serif;font-size:10pt;margin:0 0 2px;background:#F7F8F5;border:1px solid #ddd;padding:6px;">${esc(audit.q14.text[q.id]||'(no response entered)')}</p>`;
      body += `<p style="font-family:Calibri,sans-serif;font-size:9.5pt;color:#555;margin:0;">Score: <b>${score}</b> / 10</p>`;
    });
    body += `<p style="font-family:Calibri,sans-serif;font-size:11pt;margin-top:8px;"><b>Section 14 total: ${q14Total()} / ${Q14_MAX}</b></p>`;

    body += `<h2 style="font-family:Calibri,sans-serif;font-size:14pt;margin-top:20px;">OVERALL GRAND TOTAL: ${overall} / ${GRAND_MAX+Q14_MAX}</h2>`;

    body += `<h4 style="font-family:Calibri,sans-serif;font-size:11pt;margin-top:18px;">Auditor E-Signature</h4>`;
    if(audit.signature && audit.signature.dataUrl){
      body += `<p style="font-family:Calibri,sans-serif;font-size:10pt;margin:4px 0;"><b>Signed by:</b> ${esc(audit.meta.auditor||'')}</p>`;
      body += `<p style="font-family:Calibri,sans-serif;font-size:10pt;margin:4px 0;"><b>Signed at:</b> ${esc(audit.signature.signedAt ? new Date(audit.signature.signedAt).toLocaleString() : '')}</p>`;
      body += `<p style="margin:6px 0;"><img src="${audit.signature.dataUrl}" alt="Auditor electronic signature" style="width:260px;height:100px;border:1px solid #999;object-fit:contain;"></p>`;
    } else {
      body += `<p style="font-family:Calibri,sans-serif;font-size:10pt;color:#B5533C;">Not signed.</p>`;
    }

    body += `<h4 style="font-family:Calibri,sans-serif;font-size:11pt;margin-top:18px;">Special Note by the Auditors</h4>`;
    body += `<p style="font-family:Calibri,sans-serif;font-size:10.5pt;border:1px solid #ddd;padding:8px;min-height:40px;">${esc(audit.specialNote||'')}</p>`;

    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
      <head><meta charset="utf-8"><title>5S Audit Sheet</title>
      <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
      </head><body>${body}</body></html>`;

    const blob = new Blob(['\ufeff', html], {type:'application/msword'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const monthLabel = audit.meta.month || 'draft';
    a.href = url;
    a.download = `5S-Audit-${monthLabel}${audit.meta.org? '-'+audit.meta.org.replace(/[^a-z0-9]+/gi,'_') : ''}.doc`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showStatus('Downloaded '+a.download);
  }

  $('#btnExportWord').addEventListener('click', exportToWord);
  $('#btnExport').addEventListener('click', exportToExcel);
  $('#btnSave').addEventListener('click', saveAudit);
  $('#btnDelete').addEventListener('click', deleteAudit);
  $('#btnNew').addEventListener('click', ()=>{
    if(!confirm('Start a new blank audit? Unsaved changes will be lost.')) return;
    audit = blankAudit();
    const now = new Date();
    audit.meta.month = now.toISOString().slice(0,7);
    fullRender();
  });
  elLoadSelect.addEventListener('change', e=> loadAudit(e.target.value));

  // ---------------- Init ----------------
  (async function init(){
    const now = new Date();
    audit.meta.month = now.toISOString().slice(0,7);
    fullRender();
    await refreshLoadSelect();
  })();

})();
</script>
</body>
</html>
